[project]
name = "RestAPI"
version = "0.1.0"
description = "Restful API on FastAPI for ECommerce"
authors = [
    { name = "Kostiantyn Durlov", email = "konstantin_durlov.dev@protonmail.com" },
]
readme = "README.md"
requires-python = ">=3.12, <4.0"
dependencies = [
    "alembic>=1.17.0",
    "asyncio>=3.4.3",
    "asyncpg>=0.30.0",
    "fastapi>=0.119.0",
    "fastapi-cli>=0.0.13",
    "greenlet>=3.2.1",
    "loguru>=0.7.3",
    "pydantic>=2.12.0",
    "pydantic-settings>=2.9.1",
    "python-multipart>=0.0.20",
    "sqlalchemy>=2.0.44",
    "typer>=0.15.3",
    "uvicorn>=0.34.2",
]

[dependency-groups]
dev = [
    "coverage>=7.8.0",
    "httpx>=0.28.1",
    "pytest>=8.3.5",
    "pytest-asyncio>=0.26.0",
    "pytest-mock>=3.14.0",
    "black>=25.1.0",
    "isort>=6.0.1",
    "mypy>=1.15.0",
    "ruff>=0.12.11",
]

[tool.pytest.ini_options]
pythonpath = [".", "src"]
addopts = '-s -v --cache-clear'
python_functions = 'test_* *_test'
asyncio_mode = "auto"
log_cli = true
log_cli_level = "DEBUG"
log_cli_format = "%(asctime)s %(levelname)s %(message)s"

[tool.coverage.run]
omit = ["*/conftest.py", "*/test_*.py", "*/migrations/"]
